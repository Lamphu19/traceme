<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0d6efd">

  <title>TraceMe - GPS Tracker</title>

  <!-- Application installable -->
  ./manifest.json

  <!-- Feuille de style Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <!-- Feuille de style de l'application -->
  ./style.css
</head>

<body>

  <header>
    <h1>🚶 TraceMe</h1>
    <p>Suivi GPS en temps réel</p>
  </header>

  <main>

    <div id="status" role="status">
      Prêt à démarrer
    </div>

    <section class="stats" aria-label="Statistiques du trajet">

      <div class="card">
        <span>Distance</span>
        <strong id="distance">0.00 km</strong>
      </div>

      <div class="card">
        <span>Durée</span>
        <strong id="duration">00:00:00</strong>
      </div>

      <div class="card">
        <span>Vitesse moyenne</span>
        <strong id="avgSpeed">0.0 km/h</strong>
      </div>

      <div class="card">
        <span>Vitesse actuelle</span>
        <strong id="currentSpeed">0.0 km/h</strong>
      </div>

      <div class="card">
        <span>Altitude</span>
        <strong id="altitude">Indisponible</strong>
      </div>

      <div class="card">
        <span>Précision GPS</span>
        <strong id="accuracy">Indisponible</strong>
      </div>

      <div class="card">
        <span>D+</span>
        <strong id="elevationGain">0 m</strong>
      </div>

      <div class="card">
        <span>D-</span>
        <strong id="elevationLoss">0 m</strong>
      </div>

    </section>

    <section class="buttons" aria-label="Commandes du suivi">

      <button id="startBtn" type="button">
        ▶ START
      </button>

      <button id="stopBtn" type="button" disabled>
        ■ STOP
      </button>

    </section>

    <section class="map-container" aria-label="Carte du trajet">
      <div id="map"></div>
    </section>

  </main>

  <!-- Bibliothèque cartographique Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <!-- JavaScript de l'application -->
  ./app.jsscript>

</body>
</html>
