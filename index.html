<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TraceMe</title>

    <link rel="manifest" href="manifest.json">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚶 TraceMe</h1>
    </header>

    <main>
        <div class="stats">

            <div class="card">
                <span>Distance</span>
                <strong id="distance">0.00 km</strong>
            </div>

            <div class="card">
                <span>Durée</span>
                <strong id="duration">00:00:00</strong>
            </div>

            <div class="card">
                <span>Vitesse moyenne</span>
                <strong id="avgSpeed">0.0 km/h</strong>
            </div>

            <div class="card">
                <span>Altitude</span>
                <strong id="altitude">N/D</strong>
            </div>

            <div class="card">
                <span>D+</span>
                <strong id="elevationGain">0 m</strong>
            </div>

            <div class="card">
                <span>D-</span>
                <strong id="elevationLoss">0 m</strong>
            </div>

        </div>

        <div class="buttons">
            <button id="startBtn" type="button">▶ START</button>
            <button id="stopBtn" type="button" disabled>■ STOP</button>
        </div>

        <p id="status">Prêt à enregistrer un trajet.</p>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    app.jsscript>
</body>
</html>
